name: PHP CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'ci-debug:') }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: havoice_test
          MYSQL_USER: havoice
          MYSQL_PASSWORD: havoice
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=8s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, xml, filter, session, pdo, pdo_mysql, mysqli, fileinfo
          coverage: none

      - name: Validate PHP syntax (all files)
        run: |
          set -e
          for f in $(find . -name '*.php' -not -path './storage/*'); do
            php -l "$f" >/dev/null || { echo "Syntax error in $f"; exit 1; }
          done
          echo "All PHP files lint OK"

      - name: Run self-check (offline)
        run: php tools/selfcheck.php

      - name: Production check (offline)
        run: php tools/production-check.php

      - name: Configure test database
        run: |
          cat > config/config.local.php <<'PHP'
          <?php
          if (!defined('HA_ROOT')) { exit; }
          define('HA_DB_HOST', '127.0.0.1');
          define('HA_DB_PORT', 3306);
          define('HA_DB_NAME', 'havoice_test');
          define('HA_DB_USER', 'havoice');
          define('HA_DB_PASS', 'havoice');
          define('HA_DB_AUTO_SEED', false);
          define('HA_SEED_ADMIN_EMAIL', 'admin@test.local');
          define('HA_SEED_ADMIN_PASSWORD', 'TestAdmin_9x');
          define('HA_SEED_ADMIN_NAME', 'Admin');
          define('HA_DEBUG', true);
          PHP

      - name: Migrate + seed MySQL
        run: |
          set -o pipefail
          php tools/db-migrate.php --seed 2>&1 | tee /tmp/migrate-seed.log
          php tools/db-migrate.php --status 2>&1 | tee /tmp/migrate-status.log

      - name: Annotate migrate output on failure
        if: failure()
        shell: bash
        run: |
          n=0
          for f in /tmp/migrate-seed.log /tmp/migrate-status.log; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ $n -lt 18 ] || break
              msg=$(printf 'LOG|%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::${msg}"
              n=$((n+1))
            done < <(tail -n 30 "$f")
          done

      - name: Production check (with DB)
        run: php tools/production-check.php

      - name: Auth + relationship smoke (DB)
        run: |
          php -r '
          define("HA_ROOT", getcwd());
          require "config/config.php";
          require "includes/helpers.php";
          require "includes/db.php";
          require "includes/repository.php";
          require "includes/content.php";
          require "includes/auth.php";
          if (!db_ready()) { fwrite(STDERR, "DB not ready\n"); exit(1); }
          $courses = repo_courses();
          if (count($courses) < 1) { fwrite(STDERR, "no courses\n"); exit(1); }
          $lessons = 0; $stages = 0;
          foreach ($courses as $c) {
            foreach (($c["stages"] ?? []) as $s) { $stages++; $lessons += count($s["lessons"] ?? []); }
          }
          echo "courses=".count($courses)." stages=$stages lessons=$lessons\n";
          if ($lessons < 1) { fwrite(STDERR, "no lessons\n"); exit(1); }
          $res = db_user_create("U", "user".bin2hex(random_bytes(3))."@t.local", "Password9x", "user");
          if (empty($res["ok"])) { fwrite(STDERR, "user create fail\n"); exit(1); }
          $u = db_user_find_email($res["user"]["email"]);
          if (!$u || !password_verify("Password9x", $u["pass_hash"])) { fwrite(STDERR, "verify fail\n"); exit(1); }
          if (auth_is_admin()) { /* not logged in */ }
          echo "DB AUTH OK\n";
          '

      - name: Run self-check (HTTP smoke)
        run: |
          set -e
          php -S 127.0.0.1:8080 -t . >/dev/null 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null' EXIT
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8080/index.php?p=home" >/dev/null 2>&1 && break
            sleep 1
          done

          # The PR intentionally protects course/lesson/exercise pages for guests.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/selfcheck.php')
          s = p.read_text(encoding='utf-8')
          old = "$want = $name === 'not-found' ? 404 : 200;"
          new = "$want = $name === 'not-found' ? 404 : (in_array($name, ['course', 'lesson', 'exercises'], true) ? 302 : 200);"
          if old not in s:
              raise SystemExit('HTTP smoke patch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          php tools/selfcheck.php --http=http://127.0.0.1:8080
          php tools/production-check.php --http=http://127.0.0.1:8080
